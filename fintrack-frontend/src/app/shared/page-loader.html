<div class="pl-overlay" [class.pl-visible]="visible" [attr.aria-busy]="visible" aria-live="polite">
  <div class="pl-content">
    <div class="pl-logo-mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="4"  width="20" height="3.5" rx="1.75" fill="url(#lg-loader)"/>
        <rect x="2" y="10" width="14" height="3.5" rx="1.75" fill="url(#lg-loader)"/>
        <rect x="2" y="16" width="8"  height="3.5" rx="1.75" fill="url(#lg-loader)"/>
        <defs>
          <linearGradient id="lg-loader" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#6ee7b7"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="pl-bars">
      <span class="pl-bar pl-bar--1"></span>
      <span class="pl-bar pl-bar--2"></span>
      <span class="pl-bar pl-bar--3"></span>
      <span class="pl-bar pl-bar--4"></span>
      <span class="pl-bar pl-bar--5"></span>
    </div>

    <p class="pl-label">{{ label }}</p>
  </div>
</div>
