<p-toast></p-toast>

<div class="reset-layout">
  <div class="page-top-line" aria-hidden="true"></div>
  <div class="dot-grid"></div>
  <div class="reset-bg-orb orb-1"></div>
  <div class="reset-bg-orb orb-2"></div>

  <div class="reset-card">
    <div class="card-logo">
      <span class="logo-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="4"  width="20" height="3.5" rx="1.75" fill="url(#lg-reset)"/>
          <rect x="2" y="10" width="14" height="3.5" rx="1.75" fill="url(#lg-reset)"/>
          <rect x="2" y="16" width="8"  height="3.5" rx="1.75" fill="url(#lg-reset)"/>
          <defs>
            <linearGradient id="lg-reset" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#10b981"/>
              <stop offset="100%" stop-color="#6ee7b7"/>
            </linearGradient>
          </defs>
        </svg>
      </span>
      <div class="logo-wordmark">
        <div class="logo-name">
          <span class="brand-electro">Electro</span><span class="brand-finance"> Finance</span>
        </div>
        <div class="logo-sub">Gestão financeira inteligente</div>
      </div>
    </div>

    <div class="card-header">
      <div class="header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="card-title">Nova senha</h1>
      <p class="card-subtitle">Crie uma senha segura para proteger sua conta</p>
    </div>

    <form (submit)="$event.preventDefault()">
      <div class="input-group" style="--ig: 0">
        <label class="input-label" for="newPassword">Nova senha</label>
        <input
          #newPasswordInput
          class="input-field"
          id="newPassword"
          name="newPassword"
          type="password"
          placeholder="••••••••"
        />
      </div>

      <div class="input-group" style="--ig: 1">
        <label class="input-label" for="confirmPassword">Confirmar senha</label>
        <input
          #confirmPasswordInput
          class="input-field"
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="••••••••"
        />
      </div>

      <button
        type="button"
        class="btn-primary"
        (click)="resetPassword(newPasswordInput.value, confirmPasswordInput.value)"
      >
        Redefinir senha
      </button>
    </form>

    <div class="card-footer">
      <a routerLink="/auth/login" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
        </svg>
        Voltar para o login
      </a>
    </div>
  </div>
</div>
