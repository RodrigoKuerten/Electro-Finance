<p-toast></p-toast>

<div class="reset-layout">
  <div class="reset-bg-orb orb-1"></div>
  <div class="reset-bg-orb orb-2"></div>

  <div class="reset-card">
    <div class="card-logo">
      <span class="logo-mark">F</span>
      <div>
        <div class="logo-name">Finance Dashboard</div>
        <div class="logo-sub">Gestão financeira inteligente</div>
      </div>
    </div>

    <div class="card-header">
      <div class="header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="card-title">Nova senha</h1>
      <p class="card-subtitle">Crie uma senha segura para sua conta</p>
    </div>

    <form (submit)="$event.preventDefault()">
      <div class="input-group" style="--ig: 0">
        <label class="input-label" for="newPassword">Nova senha</label>
        <input
          #newPasswordInput
          class="input-field"
          id="newPassword"
          name="newPassword"
          type="password"
          placeholder="••••••••"
        />
      </div>

      <div class="input-group" style="--ig: 1">
        <label class="input-label" for="confirmPassword">Confirmar senha</label>
        <input
          #confirmPasswordInput
          class="input-field"
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="••••••••"
        />
      </div>

      <button
        type="button"
        class="btn-primary"
        (click)="resetPassword(newPasswordInput.value, confirmPasswordInput.value)"
      >
        Redefinir senha
      </button>
    </form>

    <div class="card-footer">
      <a href="/auth/login" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
        </svg>
        Voltar para o login
      </a>
    </div>
  </div>
</div>
