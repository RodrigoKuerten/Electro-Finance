<p-toast></p-toast>

<div class="reset-layout">
  <div class="reset-bg-orb orb-1"></div>
  <div class="reset-bg-orb orb-2"></div>

  <div class="reset-card">
    <div class="card-logo">
      <span class="logo-mark">F</span>
      <div>
        <div class="logo-name">Finance Dashboard</div>
        <div class="logo-sub">Gestão financeira inteligente</div>
      </div>
    </div>

    <div class="card-header">
      <div class="header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </div>
      <h1 class="card-title">Recuperar senha</h1>
      <p class="card-subtitle">Informe seu e-mail e enviaremos um link de recuperação</p>
    </div>

    <form (submit)="$event.preventDefault()">
      <div class="input-group" style="--ig: 0">
        <label class="input-label" for="email">E-mail</label>
        <input
          #emailInput
          class="input-field"
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="seu@email.com"
        />
      </div>

      <button
        type="button"
        class="btn-primary"
        (click)="sendRecovery(emailInput.value)"
      >
        Enviar link de recuperação
      </button>
    </form>

    <div class="card-footer">
      <a href="/auth/login" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
        </svg>
        Voltar para o login
      </a>
    </div>
  </div>
</div>
