<p-toast></p-toast>
<app-page-loader [visible]="isLoading" label="Enviando link..."></app-page-loader>

<div class="auth-shell">
  <div class="auth-top-line" aria-hidden="true"></div>

  <video
    class="auth-bg-video"
    src="https://stream.mux.com/Kec29dVyJgiPdtWaQtPuEiiGHkJIYQAVUJcNiIHUYeo.m3u8"
    [muted]="true"
    playsinline
    autoplay
    loop
    aria-hidden="true"
  ></video>
  <div class="auth-video-overlay"></div>

  <div class="as-orb as-orb--1"></div>
  <div class="as-orb as-orb--2"></div>
  <div class="as-orb as-orb--3"></div>
  <div class="as-grid"></div>
  <div class="as-noise"></div>

  <a routerLink="/auth/login" class="as-back">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
    </svg>
    Entrar
  </a>

  <div class="card-glow-ring" aria-hidden="true"></div>

  <div class="auth-card">

    <div class="ac-logo">
      <span class="ac-logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="4"  width="20" height="3.5" rx="1.75" fill="url(#lg-forgot)"/>
          <rect x="2" y="10" width="14" height="3.5" rx="1.75" fill="url(#lg-forgot)"/>
          <rect x="2" y="16" width="8"  height="3.5" rx="1.75" fill="url(#lg-forgot)"/>
          <defs>
            <linearGradient id="lg-forgot" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#10b981"/>
              <stop offset="100%" stop-color="#6ee7b7"/>
            </linearGradient>
          </defs>
        </svg>
      </span>
      <div class="ac-brand-text">
        <span class="brand-electro">Electro</span><span class="brand-finance"> Finance</span>
      </div>
    </div>

    <div class="ac-erp-badge">
      <span class="aeb-pulse"></span>
      Recuperação de acesso segura
    </div>

    <div class="ac-header">
      <h1 class="ac-title ac-title--lg">Recuperar senha</h1>
      <p class="ac-subtitle">Informe seu e-mail e enviaremos um link de recuperação em instantes</p>
    </div>

    <form (submit)="$event.preventDefault()">
      <div class="input-group" style="--ig: 0">
        <label class="input-label" for="email">E-mail corporativo</label>
        <input
          #emailInput
          class="input-field"
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="voce@empresa.com"
        />
      </div>

      <div class="form-divider animate-divider"></div>

      <button type="button" class="btn-primary" [disabled]="isLoading" (click)="sendRecovery(emailInput.value)">
        <span class="btn-text">Enviar link de recuperação</span>
        <span class="btn-shimmer"></span>
      </button>
    </form>

    <p class="ac-legal">Lembrou a senha? <a routerLink="/auth/login">Entrar</a></p>

  </div>
</div>
