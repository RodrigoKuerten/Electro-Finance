<div class="stub-page">
  <div class="stub-content">
    <div class="stub-icon-wrap">
      <span class="material-icons stub-icon">{{ icon }}</span>
    </div>
    <div class="stub-badge">
      <span class="material-icons" style="font-size:13px">construction</span>
      Em desenvolvimento
    </div>
    <h1 class="stub-title">{{ title }}</h1>
    <p class="stub-desc">{{ description }}</p>
    <div class="features-card">
      <div class="features-label">Funcionalidades planejadas</div>
      <ul class="features-list">
        @for (f of features; track f; let i = $index) {
          <li [style.animation-delay]="(i * 0.08) + 's'">
            <span class="material-icons check">check_circle</span>
            {{ f }}
          </li>
        }
      </ul>
    </div>
  </div>
</div>
