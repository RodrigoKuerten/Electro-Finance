spring.application.name=finance-dashboard

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fintrack}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-min-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200, https://electro-finance-ten.vercel.app}
