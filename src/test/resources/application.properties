spring.application.name=finance-dashboard

spring.datasource.url=${DB_URL:jdbc:h2:mem:fintrack-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=${JWT_SECRET:test-only-secret-do-not-use-in-production-min-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200, https://electro-finance-ten.vercel.app}
